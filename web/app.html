<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>美团周到 · Workflow First Demo</title>
  <style>
    :root {
      --mt-yellow: #ffd000;
      --ink: #1f2329;
      --muted: #747b87;
      --line: #eceff3;
      --soft: #f7f8fa;
      --green: #18a058;
      --red: #e5484d;
      --blue: #276ef1;
      --shadow: 0 18px 45px rgba(15, 23, 42, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(120deg, #fff8d8 0%, #f2f7ff 46%, #ffffff 100%);
    }
    .shell {
      width: min(1320px, calc(100vw - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(400px, 480px) 1fr;
      gap: 24px;
      align-items: start;
    }
    .phone {
      height: 920px;
      border: 12px solid #15171a;
      border-radius: 34px;
      background: #fff;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-top {
      background: var(--mt-yellow);
      padding: 18px 18px 16px;
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 18px;
    }
    .brand small, .brand a { font-size: 12px; font-weight: 700; color: #5a4a00; text-decoration: none; }
    .hero {
      margin-top: 16px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: 0;
    }
    .subline {
      margin-top: 8px;
      color: #6d5b00;
      line-height: 1.45;
      font-size: 13px;
    }
    .content { padding: 18px; flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .step {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .step.on { border-color: #191919; background: #fff9d7; }
    .step b { display: block; font-size: 12px; }
    .step span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel h2, .panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0;
    }
    .panel p { margin: 6px 0; color: var(--muted); line-height: 1.5; font-size: 13px; }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.5;
      font: inherit;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip, button {
      border: 1px solid #d8dde6;
      background: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    .chip:hover, button:hover { border-color: #191919; }
    .primary {
      background: #191919;
      color: #fff;
      border-color: #191919;
      font-weight: 800;
    }
    .secondary {
      background: var(--mt-yellow);
      border-color: var(--mt-yellow);
      color: #1f2329;
      font-weight: 800;
    }
    .ghost { background: var(--soft); }
    .danger { border-color: #ffc9ca; color: var(--red); background: #fff6f6; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 0 0 auto; }
    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line);
    }
    .kv:last-child { border-bottom: 0; }
    .kv span:first-child { color: var(--muted); }
    .question {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fcfcfd;
    }
    .question-title { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .plans {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(306px, 1fr);
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 8px;
    }
    .plan-card {
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      min-height: 360px;
    }
    .plan-card.selected { border: 2px solid #191919; }
    .plan-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .plan-label { font-size: 12px; color: var(--blue); font-weight: 900; }
    .plan-title { margin: 3px 0 0; font-weight: 900; font-size: 17px; line-height: 1.25; }
    .merchant-line { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .merchant-logo { width: 40px; height: 40px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-weight: 900; }
    .merchant-name { font-weight: 900; line-height: 1.25; }
    .merchant-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .metric-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .metric {
      background: var(--soft);
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
    }
    .metric b { display: block; font-size: 14px; margin-top: 2px; }
    .block {
      border-top: 1px solid var(--line);
      padding: 10px 0;
      font-size: 13px;
    }
    .block b { display: block; margin-bottom: 4px; }
    .quick-facts { display: grid; gap: 6px; margin: 12px 0; font-size: 13px; }
    .quick-fact { padding: 8px 10px; border-radius: 8px; background: #f8fafc; color: #374151; }
    .risk-line { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fff7ed; color: #946200; font-size: 13px; }
    .segment {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .segment-head { display: flex; justify-content: space-between; gap: 10px; }
    .segment-title { font-weight: 900; }
    .segment-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 8px; background: var(--soft); font-size: 12px; color: #4b5563; margin: 3px 4px 0 0; }
    .tag.good { color: var(--green); background: #edf9f2; }
    .tag.warn { color: #946200; background: #fff6d1; }
    .friend-box {
      background: #f6faff;
      border: 1px solid #d9e8ff;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .drawer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      width: auto;
      max-height: 78%;
      overflow: auto;
      border-radius: 14px;
      border: 1px solid #dfe3ea;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 16px;
      z-index: 20;
      display: none;
    }
    .drawer.open { display: block; }
    .busy-layer {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(2px);
      padding: 24px;
    }
    .busy-layer.open { display: flex; }
    .busy-card {
      width: min(320px, 90%);
      border: 1px solid #dfe3ea;
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 18px;
      text-align: center;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #f0f0f0;
      border-top-color: #191919;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .drawer-bar { width: 42px; height: 4px; border-radius: 99px; background: #d1d5db; margin: 0 auto 12px; }
    .bill-row, .split-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .split-row { grid-template-columns: auto 1fr 92px; }
    .split-row input[type="number"] { width: 86px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; }
    .mock-link { font-size: 12px; color: var(--blue); word-break: break-all; }
    .split-note { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fff7ed; color: #9a3412; }
    .split-note.ok { background: #edf9f2; color: var(--green); }
    .inline-input, input[type="text"], input[type="number"], select {
      width: 100%;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .context-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input[type="time"] {
      width: 100%;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    .template-chip {
      text-align: left;
      line-height: 1.4;
      max-width: 100%;
    }
    .merchant-hero {
      border-radius: 12px;
      background: linear-gradient(135deg, #fff1a8, #fff7d8);
      padding: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .merchant-hero .big-logo { width: 58px; height: 58px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 28px; }
    .coupon-card { border: 1px solid #ffd6a6; background: #fff8ed; border-radius: 8px; padding: 10px; margin: 8px 0; }
    .exec-step {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .exec-step.current { border-color: #191919; background: #fff9d7; }
    .exec-step.future { background: #f8fafc; color: #6b7280; }
    .exec-step.done { background: #f3f4f6; color: #6b7280; }
    .exec-step.viewing { box-shadow: 0 0 0 2px var(--mt-yellow) inset; }
    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .drawer-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: sticky; bottom: 0; background: #fff; padding-top: 10px; }
    .side {
      min-height: 860px;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
      padding: 20px;
      position: sticky;
      top: 20px;
    }
    .side h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0; }
    .side-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 12px; background: #fff; }
    .side-card b { display: block; margin-bottom: 6px; }
    .log { display: none; white-space: pre-wrap; max-height: 280px; overflow: auto; background: #111827; color: #e5e7eb; border-radius: 8px; padding: 12px; font-size: 12px; }
    .log.open { display: block; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: static; min-height: auto; }
      .phone { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="phone">
      <div class="phone-top">
        <div class="brand">
          <span>美团周到</span>
          <small>本地 Mock 演示 · <a href="/admin">切换商家后台</a></small>
        </div>
        <div class="hero">说一句，我帮你把这场安排到能出门。</div>
      </div>
      <div class="content">
        <div class="stepper" id="stepper"></div>
        <section id="mainView"></section>
      </div>
      <div class="drawer" id="bookingDrawer"></div>
      <div class="drawer" id="addonModal"></div>
      <div class="busy-layer" id="busyLayer">
        <div class="busy-card">
          <div class="spinner"></div>
          <b id="busyTitle">正在处理</b>
          <p id="busyMessage">正在理解你的需求，请稍等。</p>
        </div>
      </div>
    </main>
    <aside class="side">
      <h1>当前进度</h1>
      <p class="muted">这里默认只显示用户能理解的信息。评委模式展开后才看执行日志。</p>
      <div class="side-card"><b>当前目标</b><div id="sideGoal">还没开始</div></div>
      <div class="side-card"><b>当前阶段</b><div id="sideStage">等待输入</div></div>
      <div class="side-card"><b>已确认条件</b><div id="sideConfirmed">暂无</div></div>
      <div class="side-card"><b>下一步</b><div id="sideNext">输入一句真实需求</div></div>
      <div class="side-card">
        <button class="ghost" onclick="toggleJudgeMode()">评委模式 / 执行日志</button>
        <pre id="judgeLog" class="log"></pre>
      </div>
    </aside>
  </div>
  <script data-demo-presets type="application/json">
    [
      "我和 3 个朋友今晚 19:00 想在新街口到店吃饭，人均 150，想少排队，菜系都可以。",
      "4 个人今晚 19:00 想在江宁玩欢乐本，能玩 4 小时，人均 150，公共交通。",
      "我和女朋友 18:00 在仙林约会，人均 300，想看电影也想拍照，不想太累。",
      "今晚宅家，2 个人，预算 100，想点外卖和零食，不想出门。"
    ]
  </script>
  <script>
    const API = "";
    const TRUSTED_SOURCES = new Set(["explicit_text", "user_answer", "profile_memory"]);
    const AREA_OPTIONS = ["新街口", "老门东", "河西", "夫子庙", "鼓楼", "玄武湖", "江宁", "仙林", "百家湖", "奥体", "马鞍山"];
    const STEPS = [
      ["intent", "确认目标"],
      ["candidate", "比较方案"],
      ["booking", "确认预约"],
      ["execution", "执行处理"],
    ];
    let sessionId = localStorage.getItem("weekend-agent-session-id");
    if (!sessionId) {
      sessionId = "sid_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("weekend-agent-session-id", sessionId);
    }
    let session = {};
    let stage = "input";
    let selectedPlanIndex = null;
    let voteRoom = null;
    let rescueResultHTML = "";
    let friendOutcomeHTML = "";
    let otherIssueOpen = false;
    let executionCurrentIndex = 0;
    let executionViewIndex = null;
    let couponState = {};

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function jsArg(value) {
      return esc(JSON.stringify(String(value ?? "")));
    }
    function money(v) { return Number(v || 0) ? "¥" + Math.round(Number(v)) : "未定"; }
    function businessSteps(plan) {
      const steps = plan?.itinerary?.segments || plan?.steps || [];
      return steps.filter(s => s.kind !== "travel" && s.kind !== "transit").map(normalizeBusinessStep);
    }
    function normalizeBusinessStep(s) {
      const selectedId = s.selected_merchant || s.merchant_id || s.id;
      const candidates = s.merchant_candidates || [];
      const picked = candidates.find(m => m.merchant_id === selectedId || m.id === selectedId) || candidates[0] || {};
      const merged = {...picked, ...s};
      merged.id = selectedId || s.id || picked.merchant_id || picked.id;
      merged.merchant_id = selectedId || s.merchant_id || picked.merchant_id || picked.id;
      merged.name = picked.name || s.name || s.title;
      merged.category = picked.category || s.category;
      merged.area = picked.area || s.area;
      merged.cost = s.cost || s.price || picked.price || picked.cost;
      merged.price = s.price || picked.price || picked.cost || s.cost;
      merged.rating = s.rating || picked.rating;
      merged.review_count = s.review_count || picked.review_count;
      merged.review_tags = s.review_tags || picked.review_tags || s.tags;
      merged.tags = s.tags || picked.review_tags || picked.tags || [];
      merged.review_snippet = s.review_snippet || picked.review_snippet || picked.reason;
      merged.open = s.open || picked.open;
      merged.close = s.close || picked.close;
      merged.queue_minutes = s.queue_minutes ?? picked.queue_minutes;
      merged.can_reserve = s.can_reserve ?? picked.can_reserve;
      merged.group_deal = s.group_deal || picked.group_deal;
      merged.image = s.image || picked.image || s.category;
      return merged;
    }
    function travelSteps(plan) {
      const steps = plan?.itinerary?.segments || plan?.steps || [];
      return steps.filter(s => s.kind === "travel" || s.kind === "transit");
    }
    function transitSummaries(plan) {
      const transits = (plan?.itinerary?.transits || []).map(t => {
        const from = t.from?.area || t.from?.label || "出发地";
        const to = t.to?.area || t.to?.label || "下一站";
        const best = (t.options || [])[0] || {};
        const min = best.duration_minutes || best.minutes || t.minutes || 0;
        return `${from}到${to}${min ? min + "分钟" : ""}`;
      });
      if (transits.length) return transits;
      return travelSteps(plan).map(t => `${t.from || ""}到${t.to || ""}${t.minutes || 0}分钟`);
    }
    function mainPlan() {
      return session.chosen || (session.plans || [])[selectedPlanIndex || 0] || (session.plans || [])[0] || {};
    }
    function plans() { return session.plans || []; }
    function setBusy(message = "") {
      const layer = document.getElementById("busyLayer");
      const msg = document.getElementById("busyMessage");
      if (!layer) return;
      if (message) {
        if (msg) msg.textContent = message;
        layer.classList.add("open");
      } else {
        layer.classList.remove("open");
      }
    }
    async function post(path, body = {}, busyMessage = "正在处理，请稍等。") {
      setBusy(busyMessage);
      try {
        const res = await fetch(API + path, {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-Session-Id": sessionId},
          body: JSON.stringify({session_id: sessionId, ...body})
        });
        const data = await res.json();
        if (!data.ok && (data.error || data.message)) throw new Error(data.error || data.message);
        if (data.session) session = data.session;
        appendLog(path + " -> " + JSON.stringify(data).slice(0, 1800));
        return data;
      } finally {
        setBusy("");
      }
    }
    function appendLog(text) {
      const log = document.getElementById("judgeLog");
      log.textContent = (log.textContent + "\n" + text).trim().slice(-9000);
    }
    function currentStep() {
      if (stage === "input" || stage === "clarify") return "intent";
      if (stage === "candidates" || stage === "selected") return "candidate";
      if (stage === "booking") return "booking";
      return "execution";
    }
    function renderStepper() {
      const el = document.getElementById("stepper");
      if (stage === "input") {
        el.classList.add("hidden");
        el.innerHTML = "";
        return;
      }
      el.classList.remove("hidden");
      const cur = currentStep();
      el.innerHTML = STEPS.map(([key, label], idx) => `
        <div class="step ${key === cur ? "on" : ""}" onclick="jumpStep('${key}')">
          <b>${idx + 1}. ${label}</b>
        </div>
      `).join("");
    }
    function stepIndex(key) { return STEPS.findIndex(x => x[0] === key); }
    function maxUnlockedStep() {
      if (stage === "execution") return "execution";
      if (stage === "booking") return "booking";
      if (stage === "selected" || stage === "candidates") return "candidate";
      return "intent";
    }
    function jumpStep(key) {
      if (stepIndex(key) > stepIndex(maxUnlockedStep())) {
        alert("请先完成当前步骤");
        return;
      }
      if (key === "intent") stage = (session.mode === "needs_clarification") ? "clarify" : "input";
      if (key === "candidate") stage = session.chosen ? "selected" : "candidates";
      if (key === "booking") stage = "booking";
      if (key === "execution") stage = "execution";
      window.scrollTo({top: 0, behavior: "smooth"});
      render();
    }
    function clearDownstreamState(reason) {
      if (!session) return;
      if (reason === "intent" || reason === "clarification") {
        selectedPlanIndex = null;
        voteRoom = null;
        friendOutcomeHTML = "";
        delete session.chosen;
        delete session.selected_plan_index;
        delete session.vote_room;
      }
      if (["intent", "clarification", "candidate"].includes(reason)) {
        delete session.booking_review;
        delete session.bookings;
        delete session.checkout_preview;
        delete session.checkout_result;
        delete session.share_card;
      }
      if (["intent", "clarification", "candidate", "booking"].includes(reason)) {
        delete session.exception_result;
        rescueResultHTML = "";
      }
    }
    function render() {
      renderStepper();
      updateSide();
      const view = document.getElementById("mainView");
      if (stage === "input") view.innerHTML = inputHTML();
      else if (stage === "clarify") view.innerHTML = clarifyHTML();
      else if (stage === "candidates") view.innerHTML = candidatesHTML();
      else if (stage === "selected") view.innerHTML = selectedHTML();
      else if (stage === "booking") view.innerHTML = selectedHTML();
      else view.innerHTML = executionHTML();
      if (stage === "execution") setTimeout(() => updateCustomSplit(true), 0);
    }
    function inputHTML() {
      return `
        <section class="panel">
          <h2>你想怎么玩？</h2>

    function isPastTime(key, value) {

            answers[box.dataset.key] = normalizeAnswer(box.dataset.key, box.dataset.value);
          }

        }

    function executionItems(plan) {
      const segs = businessSteps(plan);
      if (isDeliveryPlan(plan)) {
        const first = segs[0] || {};
        const delivery = deliveryFact(first) || "美团外卖 · 配送约35分钟 · 配送费¥5";
        return [
          {title: "提交外卖需求", meta: `${esc(first.name || "美团外卖")} · ${esc(first.category || "")}`, segment: first, segmentIndex: 0},
          {title: "等待配送", meta: delivery, segment: first, segmentIndex: 0},
          {title: "送达 / 收货", meta: "确认收到后，本次宅家安排完成。", segment: first, segmentIndex: 0}
        ];
      }
      const items = [];
      const origin = originText(plan);
      const all = plan.steps || [];
      const firstBiz = segs[0] || {};
      const firstTransit = (plan.itinerary?.transits || [])[0];
      const firstTransitOption = (firstTransit?.options || [])[0] || {};
      const firstTransitMin = firstTransitOption.duration_minutes || travelSteps(plan)[0]?.minutes || 20;
      const firstTransitFrom = firstTransit?.from?.area || origin;
      const firstTransitTo = firstTransit?.to?.area || firstBiz.area || "第一站";
      items.push({title: "从出发地前往第一站", meta: `${firstTransitFrom} → ${firstTransitTo} · ${firstTransitMin}分钟`});
      all.forEach((s, rawIdx) => {

        }
      });
      const last = segs[segs.length - 1] || {};
      const returnTransit = (plan.itinerary || {}).return_transit || {};
      const returnOption = (returnTransit.options || [])[0] || {};
      const returnFrom = returnTransit.from?.area || last.area || "最后一站";

      items.push({title: "从最后一站回家", meta: `${returnFrom} → ${returnTo} · ${returnOption.duration_minutes || 25}分钟`});
      return items;

    function updateCustomSplit(rebalance = true) {
      const totalNode = document.getElementById("customBillTotal");
      if (!totalNode) return;
      const total = Number(totalNode.value || 0);
      const people = [...document.querySelectorAll(".aa-person:checked")];
      const allPeople = [...document.querySelectorAll(".aa-person")];
      const per = people.length ? Math.round(total / people.length) : 0;
      document.querySelectorAll(".aa-amount").forEach((node, idx) => {
        const checked = people.includes(allPeople[idx]);
        node.disabled = !checked;

      document.querySelectorAll(".split-row").forEach(row => {

      const mismatch = document.getElementById("splitMismatch");

      const total = [...document.querySelectorAll(".aa-item:checked")].reduce((sum, node) => sum + Number(node.dataset.amount || 0), 0);
      const people = [...document.querySelectorAll(".aa-person:checked")];
      const per = people.length ? Math.round(total / people.length) : 0;
      const allPeople = [...document.querySelectorAll(".aa-person")];
      document.querySelectorAll(".aa-amount").forEach((node, idx) => {
        const checked = people.includes(allPeople[idx]);
        node.disabled = !checked;
        if (rebalance && checked) {
          node.value = per;
          delete node.dataset.manual;
        }
      });
      const totalNode = document.getElementById("billTotal");
      if (totalNode) totalNode.textContent = money(total);
      let manualTotal = 0;
      document.querySelectorAll(".split-row").forEach(row => {
        const person = row.querySelector(".aa-person");
        const amountNode = row.querySelector(".aa-amount");
        const link = row.querySelector(".mock-link");
        const amount = person?.checked ? Number(amountNode?.value || 0) : 0;
        if (person?.checked) manualTotal += amount;
        if (link) link.textContent = `/mock/a-money/${encodeURIComponent(person?.dataset.name || "friend")}?amount=${amount}`;
      });
      const splitTotal = document.getElementById("splitTotal");
      if (splitTotal) splitTotal.textContent = money(manualTotal);
      const mismatch = document.getElementById("splitMismatch");
      if (mismatch) {
        const same = Math.abs(manualTotal - total) < 1;
        mismatch.className = "split-note " + (same ? "ok" : "");
        mismatch.textContent = same
          ? "手动金额合计与应分摊金额一致。"
          : "手动金额合计与应分摊金额不一致，可继续发送 Mock 链接。";
      }

    function businessSteps(plan) {
      const steps = plan?.steps || [];
      return steps.filter(s => !["travel", "transit"].includes(s.kind)).map(normalizeBusinessStep);
    }

    function normalizeBusinessStep(s) {
      const out = {...(s || {})};
      out.id = out.id || out.merchant_id || out.selected_merchant;
      out.merchant_id = out.merchant_id || out.id || out.selected_merchant;
      out.name = out.name || out.title || out.merchant_name || "待定商户";
      out.price = Number(out.price ?? out.cost ?? 0);
      out.cost = Number(out.cost ?? out.price ?? 0);
      out.tags = out.tags || out.review_tags || out.features || [];
      out.features = out.features || out.tags || [];
      out.image = out.image || emojiForCategory(out.category);
      out.open = out.open || "10:00";
      out.close = out.close || "22:00";
      out.review_snippet = out.review_snippet || "本地 Mock 候选，适合当前条件。";
      return out;
    }

    function candidateSegments() {
      const ps = plans();
      const count = Math.max(...ps.map(p => businessSteps(p).length), 0);
      return Array.from({length: count}, (_, i) => i);
    }

    function segmentOption(segmentIndex, planIndex) {
      const p = plans()[planIndex] || plans()[0] || {};
      const step = businessSteps(p)[segmentIndex];
      if (step) return localizeSegmentOption(normalizeBusinessStep(step), segmentIndex, planIndex);
      return null;
    }

    function anchorAreaForSegment(segmentIndex, fallback = {}) {
      const req = session.request || {};
      const frame = req.intent_frame || {};
      const fields = frame.confirmed_fields || {};
      return fields.home_area || req.home_area || req.origin_area || fallback.area || "";
    }

    function localizeSegmentOption(step, segmentIndex, planIndex) {
      const anchor = anchorAreaForSegment(segmentIndex, step);
      if (!anchor || !step?.area || step.area === anchor || step.area === "线上" || !phase2cMerchantCache?.length) return step;
      const primary = businessSteps(plans()[0] || {})[segmentIndex] || {};
      const sameArea = phase2cMerchantCache.filter(m =>
        m.category === step.category &&
        m.area === anchor &&
        m.id !== step.id &&
        m.id !== (primary.id || primary.merchant_id)
      );
      if (!sameArea.length) return step;
      const picked = sameArea[(segmentIndex + planIndex) % sameArea.length];
      return merchantToStep(picked, step);
    }

    async function loadPhase2cMerchants() {
      if (phase2cMerchantCache) return phase2cMerchantCache;
      try {
        const res = await fetch("/merchants", {headers: {"X-Session-Id": sessionId}});
        const data = await res.json();
        phase2cMerchantCache = data.data || [];
      } catch (e) {
        phase2cMerchantCache = [];
      }
      return phase2cMerchantCache;
    }

    function parseClockMinutes(value) {
      const text = String(value || "").trim();
      const match = text.match(/(\d{1,2}):(\d{2})/);
      if (!match) return null;
      const hour = Number(match[1]);
      const minute = Number(match[2]);
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return null;
      return hour * 60 + minute;
    }

    function valueAsMinutes(value) {
      const numeric = Number(value);
      if (Number.isFinite(numeric) && numeric > 0) return numeric;
      const text = String(value || "");
      const match = text.match(/(\d+(?:\.\d+)?)/);
      if (!match) return null;
      const amount = Number(match[1]);
      if (text.includes("小时") || /\bh\b/i.test(text)) return Math.round(amount * 60);
      return amount;
    }

    function segmentDurationMinutes(step = {}) {
      const explicit = valueAsMinutes(step.duration_minutes || step.duration);
      if (explicit) return explicit;
      const start = parseClockMinutes(step.start);
      const end = parseClockMinutes(step.end);
      if (start !== null && end !== null) {
        const normalizedEnd = end >= start ? end : end + 1440;
        return Math.max(20, normalizedEnd - start);
      }
      const category = String(step.category || "");
      const kind = String(step.kind || "");
      if (isDeliveryStep(step)) return 35;
      if (category.includes("剧本") || category.includes("密室") || kind === "activity") return 240;
      if (category.includes("电影")) return 130;
      if (category.includes("KTV")) return 180;
      if (kind === "restaurant" || category.includes("餐") || category.includes("火锅") || category.includes("烤肉")) return 90;
      return 90;
    }

    function transitMinutesBeforeSegment(index) {
      const transits = ((mainPlan().itinerary || {}).transits || []);
      const transit = transits[index] || transits[Math.max(0, index - 1)] || {};
      const options = transit.options || [];
      const publicOpt = options.find(o => String(o.mode || o.label || "").includes("公共")) || options[0] || {};
      return valueAsMinutes(publicOpt.duration_minutes || publicOpt.minutes || publicOpt.duration) || 20;
    }

    function selectedStepForSegment(index) {
      const selected = phase2cChoices[index]?.chosen;
      return (selected && phase2cChoices[index]?.[selected]) || segmentOption(index, 0) || businessSteps(mainPlan())[index] || {};
    }

    function segmentArrivalMinutes(index) {
      const req = session.request || {};
      const steps = businessSteps(mainPlan());
      let time = parseClockMinutes(req.start_time || steps[0]?.start) || (19 * 60);
      for (let j = 0; j <= index; j += 1) {
        time += transitMinutesBeforeSegment(j);
        if (j === index) break;
        time += segmentDurationMinutes(selectedStepForSegment(j));
      }
      return time;
    }

    function merchantOpenForSegment(merchant, segmentIndex, baseStep = {}) {
      const open = parseClockMinutes(merchant.open || baseStep.open);
      const closeRaw = parseClockMinutes(merchant.close || baseStep.close);
      if (open === null || closeRaw === null) return true;
      let close = closeRaw <= open ? closeRaw + 1440 : closeRaw;
      let windowOpen = open;
      let arrival = segmentArrivalMinutes(segmentIndex);
      while (arrival >= close + 1440) {
        windowOpen += 1440;
        close += 1440;
      }
      const duration = segmentDurationMinutes({...baseStep, ...merchant});
      return arrival >= windowOpen && arrival + duration <= close;
    }

    function candidatePrice(step = {}) {
      return Number(step.price || step.cost || 0) || 0;
    }

    function replacementBudgetOk(segmentIndex, candidate) {
      const budget = Number((session.request || {}).budget_per_person || 0);
      if (!Number.isFinite(budget) || budget <= 0) return true;
      const steps = businessSteps(mainPlan());
      let total = 0;
      for (let j = 0; j < steps.length; j += 1) {
        total += j === segmentIndex ? candidatePrice(candidate) : candidatePrice(selectedStepForSegment(j));
        total += 2;
      }
      return total <= budget;
    }

    function compliantReplacementPool(pool, segmentIndex, current) {
      return pool.filter(m =>
        merchantOpenForSegment(m, segmentIndex, current) &&
        replacementBudgetOk(segmentIndex, m)
      );
    }

    async function replaceSegmentOption(i, label) {
      const merchants = await loadPhase2cMerchants();
      const current = phase2cChoices[i]?.[label] || segmentOption(i, label === "A" ? 0 : 1);
      const anchor = anchorAreaForSegment(i, current);
      const categoryPool = merchants.filter(m =>
        m.category === current.category &&
        m.id !== current.id
      );
      const sameAnchor = categoryPool.filter(m => anchor && m.area === anchor);
      const sameCurrent = categoryPool.filter(m => current.area && m.area === current.area);
      const anchoredPool = compliantReplacementPool(sameAnchor, i, current);
      const currentAreaPool = compliantReplacementPool(sameCurrent, i, current);
      const broadPool = compliantReplacementPool(categoryPool, i, current);
      const areaLocked = Boolean(anchor || current.area);
      const pool = anchoredPool.length ? anchoredPool : (currentAreaPool.length ? currentAreaPool : (areaLocked ? [] : broadPool));
      if (!pool.length) {
        alert("没有找到符合时间、预算和同类要求的候选店。");
        return;
      }
      const next = pool[(Date.now() + i + label.charCodeAt(0)) % Math.max(1, pool.length)] || current;
      phase2cChoices[i] = {...(phase2cChoices[i] || {}), [label]: merchantToStep(next, current)};
      renderKeepingScroll();
    }

    function merchantToStep(m, base = {}) {
      return normalizeBusinessStep({
        ...base,
        id: m.id,
        merchant_id: m.id,
        name: m.name,
        category: m.category,
        area: m.area,
        cost: m.price,
        price: m.price,
        rating: m.rating,
        review_count: m.review_count,
        review_snippet: m.review_snippet,
        tags: m.review_tags || m.features || [],
        features: m.features || m.review_tags || [],
        open: m.open,
        close: m.close,
        image: m.image,
        duration_minutes: m.duration_minutes,
        can_reserve: m.can_reserve,
        queue_minutes: m.queue_minutes,
        group_deal: m.group_deal,
        coupons: m.coupons || [],
        kind: base.kind || roleKind(m.slot_role),
        slot_role: m.slot_role || base.slot_role,
        start: base.start,
        end: base.end
      });
    }

    function roleKind(role) {
      return {PLAY: "activity", EAT: "restaurant", ADDON: "addon", STAYIN: "delivery"}[role] || "activity";
    }

    function isDeliveryStep(step = {}) {
      const category = String(step.category || "");
      const kind = String(step.kind || "");
      const role = String(step.role || step.slot_role || "");
      return kind === "delivery" || role === "STAYIN" || category.includes("外卖") || category.includes("零食");
    }

    function isDeliveryOnlyPlan(plan = mainPlan()) {
      const segs = businessSteps(plan);
      return segs.length > 0 && segs.every(isDeliveryStep);
    }

    function deliveryStepsFromPlan(plan = mainPlan()) {
      return businessSteps(plan).filter(isDeliveryStep);
    }

    function requestText() {
      return String((session.request || {}).raw_text || phase2cMessages.find(m => m.role === "user")?.text || "");
    }

    function actualPartySize() {
      const req = session.request || {};
      const text = requestText();
      const hasNumericPeople = /\d+\s*(个|人|位)/.test(text);
      if (!hasNumericPeople && /我和(女朋友|男朋友|对象|老婆|老公)|情侣|约会|二人世界/.test(text)) return 2;
      const n = Number(req.party_size || req.people || 0);
      if (Number.isFinite(n) && n > 0) return n;
      return 1;
    }

    function isRomanticOccasion() {
      const req = session.request || {};
      const text = requestText();
      const tags = [
        ...(req.intent_tags || []),
        ...(req.preferences || []),
        req.primary_intent,
        req.occasion
      ].filter(Boolean).join(" ");
      return /生日|约会|纪念日|女朋友|男朋友|对象|情侣|仪式感/.test(`${text} ${tags}`);
    }

    function bookingKind(seg = {}) {
      const cat = String(seg.category || seg.role || seg.slot_role || "");
      const name = String(seg.merchant_name || seg.name || "");
      if (/剧本|推理|欢乐本|恐怖本/.test(cat + name)) return "script";
      if (/电影院|电影|影院/.test(cat + name)) return "cinema";
      if (/KTV|唱歌/.test(cat + name)) return "ktv";
      if (/奶茶|咖啡|饮品/.test(cat + name)) return "drink";
      if (/外卖|闪购|零食|小象/.test(cat + name)) return "delivery";
      return "restaurant";
    }

    function scriptOptionsFor(seg = {}) {
      const tables = seg.open_tables || seg.slots || [];
      const fromData = tables.map((t, idx) => ({
        label: `${t.script_name || t.name || `剧本${idx + 1}`} · ${t.style || t.type || "盒装本"} · ${t.required_players || t.players || actualPartySize()}人 · ${Math.round((t.duration_minutes || seg.duration_minutes || 240) / 60)}h`,
        value: t.script_name || t.name || `script_${idx + 1}`
      }));
      return fromData.length ? fromData : [
        {label: "《欢乐时光》 · 欢乐本 · 6人 · 4h", value: "欢乐时光"},
        {label: "《鬼校》 · 恐怖本 · 7人 · 5h", value: "鬼校"},
        {label: "《消失的合伙人》 · 推理本 · 5人 · 4h", value: "消失的合伙人"}
      ];
    }

    function movieOptionsFor() {
      return [
        {label: "《周末大冒险》 18:30 场", value: "周末大冒险"},
        {label: "《夏夜来信》 19:10 场", value: "夏夜来信"},
        {label: "《重启星期六》 20:00 场", value: "重启星期六"}
      ];
    }

    function roomForParty() {
      const p = actualPartySize();
      if (p <= 2) return "小包";
      if (p <= 5) return "中包";
      return "大包";
    }

    function drinkDefaults() {
      const prefs = (session.request || {}).drink_preferences || {};
      const flags = (session.request || {}).safety_flags || [];
      return {
        sugar: prefs.sugar_level || (flags.includes("not_too_sweet") ? "少糖" : "正常糖"),
        ice: prefs.hot_required ? "热饮" : (flags.includes("cannot_ice") ? "常温" : (prefs.ice_level || "少冰"))
      };
    }

    function bookingExtraFields(seg, i) {
      const kind = bookingKind(seg);
      if (kind === "script") {
        return `<div class="booking-extra"><b>剧本选择</b><select id="scriptChoice${i}">${scriptOptionsFor(seg).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")}</select></div>`;
      }
      if (kind === "cinema") {
        return `<div class="booking-extra"><b>电影选座</b><select id="movieChoice${i}">${movieOptionsFor().map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")}</select><div class="mini-select-grid">${["5排06座", "5排07座", "6排08座", "6排09座"].map((s, idx) => `<button type="button" class="${idx < actualPartySize() ? "selected" : ""}" onclick="this.classList.toggle('selected')">${s}</button>`).join("")}</div></div>`;
      }
      if (kind === "ktv") {
        const room = roomForParty();
        return `<div class="booking-extra"><b>包间选择</b><select id="roomChoice${i}">${["小包", "中包", "大包"].map(x => `<option ${x === room ? "selected" : ""}>${x}</option>`).join("")}</select><p class="muted">已按人数预选 ${room}。</p></div>`;
      }
      if (kind === "drink") {
        const d = drinkDefaults();
        return `<div class="booking-extra"><b>商品选择</b><select id="drinkProduct${i}"><option>苹果奶绿</option><option>热红茶拿铁</option><option>低糖乌龙</option></select><div class="mini-select-grid"><input id="drinkSugar${i}" value="${esc(d.sugar)}"><input id="drinkIce${i}" value="${esc(d.ice)}"></div></div>`;
      }
      return "";
    }

    function isSnackMerchant(step = {}) {
      const text = `${step.category || ""}${step.name || ""}`;
      return /零食|闪购|小象|超市|薯片|可乐/.test(text);
    }

    function isDrinkMerchant(step = {}) {
      const text = `${step.category || ""}${step.name || ""}`;
      return /奶茶|咖啡|饮品|茶/.test(text);
    }

    function prefersPinhaofan(step = {}) {
      const seed = String(step.id || step.name || "").split("").reduce((s, ch) => s + ch.charCodeAt(0), 0);
      return isDeliveryStep(step) && !isSnackMerchant(step) && !isDrinkMerchant(step) && seed % 3 !== 1;
    }

    function deliveryProducts(step = {}) {
      let names;
      if (isSnackMerchant(step)) {
        names = ["小象原味薯片", "无糖可乐", "黄油爆米花桶", "小象零食分享包"];
      } else if (isDrinkMerchant(step)) {
        names = ["苹果奶绿", "热红茶拿铁", "低糖乌龙茶", "柠檬茶"];
      } else {
        names = ["美团拼好饭单人餐", "招牌单人餐", "双人分享餐", "番茄牛肉饭"];
      }
      const priceBase = Math.max(12, Math.round(Number(step.price || step.cost || 60) / 3));
      return names.map((name, index) => ({
        name,
        price: priceBase + index * 6,
        note: prefersPinhaofan(step) && index === 0 ? "美团拼好饭优先" : (isSnackMerchant(step) ? "零食补给" : "可加购"),
        pinhaofan: prefersPinhaofan(step) && index === 0
      }));
    }

    function segmentLabel(step) {
      const cat = step?.category || "";
      if (cat.includes("剧本")) return "剧本杀";
      if (["火锅", "江浙菜", "烧烤", "海鲜", "简餐", "外卖"].includes(cat)) return "吃饭";
      if (cat.includes("电影")) return "看电影";
      if (cat.includes("奶茶") || cat.includes("咖啡")) return "顺手加购";
      return cat || "行程";
    }

    async function confirmSegmentChoice(i, label) {
      const current = phase2cChoices[i] || {};
      const step = current[label] || segmentOption(i, label === "A" ? 0 : 1);
      phase2cChoices[i] = {...current, [label]: step, chosen: label};
      pushPhase2cMessage("user", `第 ${i + 1} 段确认方案 ${label}：${step?.name || "候选商户"}`);
      const all = candidateSegments().every(idx => phase2cChoices[idx]?.chosen);
      if (!all) { renderKeepingScroll(); return; }
      const selected = candidateSegments().map(idx => {
        const item = phase2cChoices[idx];
        const planLabel = item.chosen;
        return {
          segment_index: idx,
          plan_index: planLabel === "B" ? 1 : 0,
          plan_label: `Plan ${planLabel}`,
          step: item[planLabel] || segmentOption(idx, planLabel === "B" ? 1 : 0)
        };
      });
      const data = await post("/select_segments", {segments: selected}, "正在生成逐段预约单…");
      session = data.session || session;
      pushPhase2cMessage("agent", "所有主行程都选好了，我把预约单预填出来，你逐段确认即可。");
      stage = "booking";
      render();
    }

    function askFriends(i) {
      phase2cVotes[i] = phase2cVotes[i] || {A: 0, B: 0};
      alert("分享链接已复制");
      pushPhase2cMessage("agent", `第 ${i + 1} 段的共选链接已复制，可以喊朋友一起挑。`);
      renderKeepingScroll();
    }
    function selfVote(i, label) {
      phase2cVotes[i] = phase2cVotes[i] || {A: 0, B: 0};
      phase2cVotes[i][label] += 1;
      renderKeepingScroll();
    }
    function simulateFriendVote(i) {
      const party = Math.max(1, Number((session.request || {}).party_size || 4));
      phase2cVotes[i] = {A: Math.ceil(party / 2), B: Math.floor(party / 2)};
      pushPhase2cMessage("agent", `模拟朋友投票完成：方案 A ${phase2cVotes[i].A} 票，方案 B ${phase2cVotes[i].B} 票。`);
      renderKeepingScroll();
    }

    function bookingPageHTML() {
      if (isDeliveryOnlyPlan(mainPlan())) return deliveryOrderPageHTML();
      const review = session.booking_review || {};
      const segs = review.segments || [];
      if (!segs.length) return `<div class="bubble agent"><h2>还没有可预约的行程</h2><button onclick="stage='candidates';render()">回去选方案</button></div>`;
      return phase2cConversationHTML(segs.map((seg, i) => bookingBubbleHTML(seg, i)).join(""));
    }

    function deliveryOrderPageHTML() {
      const segs = deliveryStepsFromPlan();
      if (!segs.length) return `<div class="bubble agent"><h2>还没有可点单的外卖</h2><button onclick="stage='candidates';render()">回去选方案</button></div>`;
      return phase2cConversationHTML(segs.map((seg, i) => deliveryOrderBubbleHTML(seg, i)).join(""));
    }

    function deliveryOrderBubbleHTML(seg, i) {
      const confirmed = phase2cBookings[`delivery_${i}`] === true;
      const products = deliveryProducts(seg);
      const desired = (session.request || {}).start_time || "19:30";
      return `
        <div class="bubble agent">
          <h2>${esc(seg.name || "美团外卖")}</h2>
          <button class="linkish" onclick="openPhase2cMerchantDetail(${jsArg(seg.id || seg.merchant_id || "")})">查看商详</button>
          <div class="booking-form">
            <div class="booking-row"><span>希望送达时间</span><input id="deliveryTime${i}" value="${esc(desired)}"></div>
            <div class="booking-row"><span>收货人</span><input id="deliveryName${i}" value="发起人"></div>
            <div class="booking-row"><span>联系方式</span><input id="deliveryPhone${i}" value="13800000000"></div>
            <div class="booking-row"><span>收货地址</span><input id="deliveryAddress${i}" value="${esc((session.request || {}).origin_area || (session.request || {}).home_area || "当前位置")} 附近 Mock 地址"></div>
            <div class="booking-row"><span>备注</span><textarea id="deliveryNote${i}">本地 Mock 外卖点单，不会真实下单。</textarea></div>
          </div>
          <div class="tip-row">
            ${products.map((p, idx) => `<div class="tip-card"><b>${esc(p.name)}</b><p>${esc(p.note)}</p><p>¥${esc(p.price)}</p><div class="qty-row"><span>份数</span><input id="deliveryQty${i}_${idx}" type="number" min="1" value="1"><button class="primary" onclick="confirmProductPurchase(${jsArg(`delivery_${i}_${idx}`)}, ${jsArg(p.name)}, ${Number(p.price)}, 'deliveryQty${i}_${idx}')">加入</button></div></div>`).join("")}
          </div>
          <div class="segment-actions">
            ${confirmed ? `<button class="primary" onclick="stage='execution';phase2cExecutionIndex=0;render()">进入配送执行</button>` : `<button class="primary" onclick="confirmDeliveryOrder(${i})">确认点单</button>`}
            <button onclick="openPhase2cMerchantDetail(${jsArg(seg.id || seg.merchant_id || "")})">查看商详</button>
            <button class="danger" onclick="stage='candidates';render()">取消</button>
          </div>
        </div>`;
    }

    function confirmDeliveryOrder(i) {
      const seg = deliveryStepsFromPlan()[i] || {};
      phase2cBookings[`delivery_${i}`] = true;
      const all = deliveryStepsFromPlan().every((_, idx) => phase2cBookings[`delivery_${idx}`] === true);
      if (all) {
        pushPhase2cMessage("agent", "外卖已模拟点单，直接进入配送执行。");
        stage = "execution";
        phase2cExecutionIndex = 0;
        render();
      } else {
        renderKeepingScroll();
      }
    }

    function bookingBubbleHTML(seg, i) {
      const confirmed = phase2cBookings[i] === true || seg.status === "confirmed";
      const fields = seg.prefilled_fields || {};
      return `
        <div class="bubble agent">
          <h2>${esc(seg.merchant_name || "预约单")}</h2>
          <div class="booking-form">
            <div class="booking-row"><span>店铺名称</span><b>${esc(seg.merchant_name || "-")}</b></div>
            <div class="booking-row"><span>预计到店时间</span><input id="bookTime${i}" value="${esc(seg.scheduled_start || fields.scheduled_start || "19:00")}"></div>
            <div class="booking-row"><span>预计到店人数</span><input id="bookPeople${i}" value="${esc(seg.party_size || fields.party_size || actualPartySize())}"></div>
            <div class="booking-row"><span>联系人</span><input id="bookName${i}" value="发起人"></div>
            <div class="booking-row"><span>联系方式</span><input id="bookPhone${i}" value="13800000000"></div>
            ${bookingExtraFields(seg, i)}
            <div class="booking-row"><span>特殊需求</span><textarea id="bookNote${i}">${esc(defaultBookingNote(seg))}</textarea></div>
          </div>
          <div class="segment-actions">
            ${confirmed ? `<button class="primary" onclick="copyBookingShare(${i})">分享给朋友</button>` : `<button class="primary" onclick="confirmBookingSegment(${i})">确认预约</button>`}
            <button onclick="alert('即将拨打商家号码 Mock')">咨询商家</button>
            <button class="danger" onclick="cancelBookingSegment(${i})">取消</button>
          </div>
        </div>`;
    }

    function defaultBookingNote(seg) {
      if (seg.category === "剧本杀") return "希望欢乐本/新手友好，按到店人数预留。";
      if (seg.role === "EAT") return "少排队，尽量安排安静座位。";
      return "本地 Mock 预约，请商家确认。";
    }

    async function confirmBookingSegment(i) {
      phase2cBookings[i] = true;
      pushPhase2cMessage("user", `第 ${i + 1} 段预约确认。`);
      const segs = (session.booking_review || {}).segments || [];
      const all = segs.every((_, idx) => phase2cBookings[idx] === true);
      if (!all) { render(); return; }
      const data = await post("/booking/confirm", {}, "正在确认本地 Mock 预约…");
      session = data.session || session;
      pushPhase2cMessage("agent", "预约完成，进入执行页。路上、到店、顺路提示和账单都在这里处理。");
      stage = "execution";
      phase2cExecutionIndex = 0;
      phase2cDrawer = "";
      render();
    }
    function copyBookingShare() { alert("预约信息链接已复制"); }
    function cancelBookingSegment(i) {
      delete phase2cChoices[i];
      delete phase2cBookings[i];
      stage = "candidates";
      render();
    }

    function executionHTML() {
      const plan = mainPlan();
      const blocks = executionBlocks(plan);
      phase2cBill.items = phase2cBill.items || [];
      const deliveryOnly = isDeliveryOnlyPlan(plan);
      const hasVisibleTip = blocks.some(b => b.type === "tip");
      const actionButtons = [
        (!deliveryOnly && !hasVisibleTip) ? `<button onclick="openPhase2cDrawer('addon')">顺手来一个</button>` : "",
        !deliveryOnly ? `<button onclick="openPhase2cDrawer('change')">行程有变化？</button>` : "",
        `<button onclick="openPhase2cDrawer('bill')">账单</button>`,
        `<button onclick="openPhase2cDrawer('support')">联系客服</button>`
      ].filter(Boolean).join("");
      const actionBlock = `
        <div class="flow-block">
          <div class="segment-actions">
            ${actionButtons}
          </div>
        </div>
        <div class="flow-block">
          <button class="primary" onclick="finishPhase2cTrip()">完成</button>
        </div>`;
      return `
        <section class="panel">
          <h2>执行中</h2>
          ${blocks.map((b, i) => executionBlockHTML(b, i)).join("")}
          ${actionBlock}
        </section>
        ${phase2cDrawer}`;
    }

    function executionBlocks(plan) {
      const segs = businessSteps(plan);
      const transits = (plan.itinerary?.transits || []);
      const blocks = [];
      if (segs.length && segs.every(isDeliveryStep)) {
        segs.forEach(seg => blocks.push({type: "delivery", segment: seg}));
        return blocks;
      }
      segs.forEach((seg, i) => {
        if (isDeliveryStep(seg)) {
          blocks.push({type: "delivery", segment: seg});
          return;
        }
        const tr = transits[i] || null;
        blocks.push({type: "transport", title: i === 0 ? "从出发地前往第一站" : "路上移动", transit: tr, from: tr?.from?.area || "出发地", to: seg.area || "下一站"});
        blocks.push({type: "itinerary", segment: seg});
        const tip = tipForSegment(seg);
        if (tip) blocks.push({type: "tip", tip});
      });
      const ret = plan.itinerary?.return_transit;
      if (ret && segs.some(seg => !isDeliveryStep(seg))) blocks.push({type: "transport", title: "返程", transit: ret, from: ret.from?.area || "上一站", to: ret.to?.area || "出发地"});
      return blocks;
    }

    function executionBlockHTML(block, i) {
      const state = i < phase2cExecutionIndex ? "done" : i === phase2cExecutionIndex ? "current" : "future";
      if (block.type === "transport") {
        const opts = transitOptions(block);
        const taxi = opts.find(o => o.kind === "taxi") || opts[1];
        const taxiState = phase2cTaxi[`tr_${i}`];
        return `<div class="flow-block ${state}" onclick="${i < phase2cExecutionIndex ? `phase2cExecutionIndex=${i};render()` : ""}">
          <h3>${esc(block.title)}</h3>
          <div class="transport-options">
            ${opts.map(o => `<div class="transport-option"><span>${esc(o.label)}：${esc(o.price)}，${esc(o.time)}</span><button onclick="event.stopPropagation();${o.kind === "taxi" ? `requestTaxi('tr_${i}', ${jsArg(JSON.stringify(o))})` : `alert('${esc(o.action)} Mock 页面')`}">${esc(o.action)}</button></div>`).join("")}
          </div>
          ${taxiState ? `<div class="taxi-status"><b>${taxiState.status === "confirmed" ? "美团打车已确认" : "美团打车正在为您叫车……预计 " + taxiState.eta + " 分钟"}</b>${taxiState.status === "confirmed" ? `<p>已计入打车费用 ¥${Math.round(taxiState.cost || 0)}</p>` : `<div class="segment-actions"><button class="primary" onclick="event.stopPropagation();confirmTaxi('tr_${i}')">确认上车</button><button class="danger" onclick="event.stopPropagation();cancelTaxi('tr_${i}')">取消订单</button></div>`}</div>` : ""}
          <button class="primary" onclick="event.stopPropagation();completeExecutionBlock(${i})">${i < phase2cExecutionIndex ? "已完成" : "已完成"}</button>
        </div>`;
      }
      if (block.type === "delivery") {
        const s = block.segment || {};
        const desired = (session.request || {}).start_time || "19:30";
        const fee = Math.max(3, Math.round(Number(s.price || s.cost || 60) / 20));
        return `<div class="flow-block ${state}" onclick="${i < phase2cExecutionIndex ? `phase2cExecutionIndex=${i};render()` : ""}">
          <h3>${esc(s.name || "美团外卖")}</h3>
          <div class="quote">实时送达位置：骑手已接单，预计 ${esc(desired)} 前后送达。</div>
          <div class="metric-bar">
            <div class="metric">服务<b>美团外卖</b></div>
            <div class="metric">希望送达<b>${esc(desired)}</b></div>
            <div class="metric">配送费<b>¥${esc(fee)}</b></div>
            <div class="metric">品类<b>${esc(s.category || "外卖")}</b></div>
          </div>
          <div class="segment-actions">
            <button onclick="event.stopPropagation();openPhase2cMerchantDetail(${jsArg(s.id || s.merchant_id || "")})">商详</button>
            <button onclick="event.stopPropagation();openPhase2cDrawer('product',${jsArg(s.name || "外卖商品")})">商品选择</button>
            <button onclick="event.stopPropagation();openPhase2cDrawer('support',${jsArg(s.id || "")})">联系客服</button>
            <button class="primary" onclick="event.stopPropagation();completeExecutionBlock(${i})">确认收货</button>
          </div>
        </div>`;
      }
      if (block.type === "tip") {
        const tips = block.tip;
        return `<div class="flow-block ${state}"><h3>顺路提示</h3><div class="tip-row">${tips.map(t => `<div class="tip-card"><b>${esc(t.item)}</b><p onclick="openPhase2cMerchantDetail(${jsArg(t.merchant_id)})">${esc(t.store)}</p><p onclick="openPhase2cDrawer('product',${jsArg(t.name)})">${esc(t.name)} / ¥${esc(t.price)}</p></div>`).join("")}</div></div>`;
      }
      const s = block.segment;
      return `<div class="flow-block ${state}" onclick="${i < phase2cExecutionIndex ? `phase2cExecutionIndex=${i};render()` : ""}">
        <h3>${esc(s.name)}</h3>
        <div class="metric-bar">
          <div class="metric">营业时间<b>${esc(s.open || "10:00")}-${esc(s.close || "22:00")}</b></div>
          <div class="metric">距离<b>${esc(distanceText(s.area))}</b></div>
          <div class="metric">人均<b>${money(s.price || s.cost)}</b></div>
          <div class="metric">品类<b>${esc(s.category || "本地生活")}</b></div>
        </div>
        <div class="segment-actions">
          <button onclick="event.stopPropagation();openPhase2cDrawer('pay',${jsArg(s.id)})">买单</button>
          <button onclick="event.stopPropagation();openPhase2cDrawer('coupon',${jsArg(s.id)})">购买/核验券</button>
          <button onclick="event.stopPropagation();openPhase2cDrawer('review',${jsArg(s.id)})">评价</button>
          <button onclick="event.stopPropagation();openPhase2cDrawer('support',${jsArg(s.id)})">联系客服</button>
          <button class="primary" onclick="event.stopPropagation();completeExecutionBlock(${i})">已完成</button>
        </div>
      </div>`;
    }

    function transitOptions(block) {
      const opts = block.transit?.options || [];
      const pub = opts.find(o => o.mode === "public") || {duration_minutes: 28, cost: 2};
      const taxi = opts.find(o => o.mode === "taxi") || {duration_minutes: 18, cost: 24};
      return [
        {kind: "public", label: "公共交通", price: `¥${pub.cost ?? 2}`, cost: Number(pub.cost ?? 2), time: `${pub.duration_minutes || 28}分钟`, duration: Number(pub.duration_minutes || 28), action: "导航"},
        {kind: "taxi", label: "打车", price: `¥${taxi.cost ?? 24}`, cost: Number(taxi.cost ?? 24), time: `${taxi.duration_minutes || 18}分钟`, duration: Number(taxi.duration_minutes || 18), action: "打车"}
      ];
    }
    function completeExecutionBlock(i) {
      const blocks = executionBlocks(mainPlan());
      let next = Math.max(phase2cExecutionIndex, i + 1);
      while (blocks[next]?.type === "tip") next += 1;
      phase2cExecutionIndex = next;
      render();
    }

    function requestTaxi(blockId, optionJson) {
      let option = {};
      try { option = JSON.parse(optionJson || "{}"); } catch (e) { option = {}; }
      phase2cTaxi[blockId] = {
        status: "calling",
        cost: Number(option.cost || 24),
        eta: Math.max(2, Math.min(8, Math.round((Number(option.duration || 18) || 18) / 4)))
      };
      renderKeepingScroll();
    }

    function confirmTaxi(blockId) {
      const item = phase2cTaxi[blockId] || {cost: 24, eta: 4};
      phase2cTaxi[blockId] = {...item, status: "confirmed"};
      upsertBillItem(`taxi_${blockId}`, "美团打车", Number(item.cost || 0), "taxi");
      renderKeepingScroll();
    }

    function cancelTaxi(blockId) {
      delete phase2cTaxi[blockId];
      renderKeepingScroll();
    }

    function tipForSegment(seg) {
      if (["restaurant", "activity"].includes(seg.kind)) {
        if (isRomanticOccasion()) {
          return [
            {item: "花店送花", store: "美团鲜花速达", merchant_id: "flower_001", name: "生日玫瑰88朵", price: 188},
            {item: "花店送花", store: "美团鲜花速达", merchant_id: "flower_002", name: "恩爱蔷薇99朵", price: 199},
            {item: "花店送花", store: "美团鲜花速达", merchant_id: "flower_003", name: "纪念茉莉66朵", price: 166}
          ];
        }
        return [
          {item: "来杯奶茶", store: "茶小满·顺路店", merchant_id: "m_029", name: "蜜桃乌龙", price: 18},
          {item: "小零食", store: "闪购零食补给站", merchant_id: "m_008", name: "朋友分享装", price: 29}
        ];
      }
      return null;
    }

    function openPhase2cDrawer(type, id = "") {
      if (type === "change") phase2cDrawer = changeDrawerHTML();
      else if (type === "bill") phase2cDrawer = billDrawerHTML();
      else if (type === "addon") phase2cDrawer = simpleDrawer("顺手来一个", `<p>这里展示当前路线附近的本地 Mock 小加购，不自动进入账单。</p><button onclick="addBillItem('顺路加购', 18);closePhase2cDrawer()">加入一杯 ¥18</button>`);
      else if (type === "pay") phase2cDrawer = simpleDrawer("买单", `<p>输入金额，完成本地 Mock 买单。</p><input id="mockPayAmount" value="128"><button class="primary" onclick="addBillItem('买单', Number(document.getElementById('mockPayAmount').value || 0));closePhase2cDrawer()">确认买单</button>`);
      else if (type === "coupon") phase2cDrawer = couponDrawerHTML(id);
      else if (type === "review") phase2cDrawer = simpleDrawer("评价", `<textarea placeholder="写一句评价 Mock"></textarea><button class="primary" onclick="alert('评价已提交 Mock');closePhase2cDrawer()">提交评价</button>`);
      else if (type === "support") phase2cDrawer = simpleDrawer("联系客服", `<p>已进入客服 Mock 页面，不连接真实客服。</p><button onclick="alert('客服工单已生成 Mock')">生成工单</button>`);
      else if (type === "product") phase2cDrawer = simpleDrawer("商品选择", `<p>${esc(id)}，本地 Mock 商品选择。</p><button onclick="addBillItem('顺路加购', 18);closePhase2cDrawer()">购买 ¥18</button>`);
      render();
    }
    function closePhase2cDrawer() { phase2cDrawer = ""; render(); }
    function simpleDrawer(title, body) { return `<div class="mini-drawer"><div class="drawer-bar"></div><h2>${esc(title)}</h2>${body}<button onclick="closePhase2cDrawer()">关闭</button></div>`; }
    function couponDrawerHTML(id) {
      const m = findMerchant(id) || {};
      const coupons = m.coupons || [{title: "到店团购券", price: 88}, {title: "满减券", price: 20}];
      return simpleDrawer("购买/核验券", coupons.map(c => `<div class="segment"><b>${esc(c.title || c.name)}</b><p>¥${esc(c.price || c.value || 0)}</p><button onclick="addBillItem('${esc(c.title || c.name)}', ${Number(c.price || c.value || 0)});alert('已购买，二维码 Mock 已生成')">购买/核验</button></div>`).join(""));
    }
    function changeDrawerHTML() {
      const segs = businessSteps(mainPlan());
      const selected = window.phase2cChangeSegment === undefined ? null : Number(window.phase2cChangeSegment);
      return `<div class="mini-drawer"><div class="drawer-bar"></div><h2>行程有变化？</h2>
        <p>先选中需要修改的行程。</p>
        ${segs.map((s, i) => `<button class="${selected === i ? "primary" : ""}" style="${selected === i ? "background:var(--mt-yellow);color:#111;border-color:#111;" : ""}" onclick="selectPhase2cRescueSegment(${i})">${esc(s.name)} · ${esc(s.category)}</button>`).join("")}
        <p>再选择需要修改的方向。</p>
        <div class="chips">
          <button class="chip" ${selected === null ? "disabled" : ""} onclick="mockRescue('不去了')">不去了</button>
          <button class="chip" ${selected === null ? "disabled" : ""} onclick="mockRescue('晚点到')">晚点到</button>
          <button class="chip" ${selected === null ? "disabled" : ""} onclick="mockRescue('加个人')">加个人</button>
        </div>
        <div id="rescuePreview">${rescueResultHTML || ""}</div>
        <button onclick="closePhase2cDrawer()">关闭</button>
      </div>`;
    }
    function selectPhase2cRescueSegment(i) {
      window.phase2cChangeSegment = i;
      rescueResultHTML = "";
      phase2cDrawer = changeDrawerHTML();
      renderKeepingScroll();
    }
    function confirmPhase2cRescueBooking() {
      closePhase2cDrawer();
    }
    function mockRescue(reason) {
      const segs = businessSteps(mainPlan());
      const idx = window.phase2cChangeSegment === undefined ? null : Number(window.phase2cChangeSegment);
      if (idx === null || Number.isNaN(idx)) {
        alert("请先选中需要修改的行程。");
        return;
      }
      const result = reason === "不去了" ? "已取消预约" : "已为您通知商家";
      rescueResultHTML = `<div class="segment"><b>${esc(segs[idx]?.name || "当前行程")}</b><p>${esc(result)}</p><span class="tag warn">调整方向：${esc(reason)}</span></div>`;
      phase2cDrawer = changeDrawerHTML();
      renderKeepingScroll();
    }
    function billItemsFromBlocks(blocks) {
      const items = [];
      blocks.forEach((b, i) => {
        if (b.type === "transport") {
          const taxi = transitOptions(b).find(x => x.label === "打车");
          items.push({id: `tr_${i}`, label: b.title, amount: Number(String(taxi.price).replace(/[^\d]/g, "")) || 0});
        }
        if (b.type === "itinerary") items.push({id: b.segment.id || `seg_${i}`, label: b.segment.name, amount: Number(b.segment.price || b.segment.cost || 0)});
        if (b.type === "delivery") items.push({id: b.segment.id || `delivery_${i}`, label: `${b.segment.name || "美团外卖"} 点单`, amount: Number(b.segment.price || b.segment.cost || 0)});
      });
      return items;
    }
    function billDrawerHTML() {
      const party = Math.max(1, Number((session.request || {}).party_size || 1));
      phase2cBill.items.forEach(it => { if (phase2cBill.included[it.id] === undefined) phase2cBill.included[it.id] = true; });
      const total = phase2cBill.items.filter(it => phase2cBill.included[it.id]).reduce((s, it) => s + Number(it.amount || 0), 0);
      return `<div class="mini-drawer"><div class="drawer-bar"></div><h2>账单</h2>
        ${phase2cBill.items.map(it => `<label class="booking-row"><span><input type="checkbox" ${phase2cBill.included[it.id] ? "checked" : ""} onchange="phase2cBill.included['${esc(it.id)}']=this.checked;openPhase2cDrawer('bill')"> ${esc(it.label)}</span><b>¥${Math.round(it.amount || 0)}</b></label>`).join("")}
        <div class="booking-row"><span>总金额</span><input value="${Math.round(total)}" oninput="phase2cBill.total=Number(this.value||0)"></div>
        <div class="booking-row"><span>单人金额</span><input value="${Math.round(total / party)}" oninput="phase2cBill.perPerson=Number(this.value||0)"></div>
        <p>收款链接：/mock/a-money?amount=${Math.round(total)}（美团/微信支付 Mock）</p>
        <button onclick="closePhase2cDrawer()">关闭</button>
      </div>`;
    }
    function addBillItem(label, amount) {
      const id = "manual_" + Date.now();
      phase2cBill.items.push({id, label, amount});
      phase2cBill.included[id] = true;
    }
    function finishPhase2cTrip() {
      phase2cDrawer = simpleDrawer("美团已帮您安排妥当", `<p>您有多愿意将美团周到分享给朋友？</p><div class="chips">${Array.from({length: 11}, (_, i) => `<button onclick="ratePhase2cScore(${i})">${i}</button>`).join("")}</div>`);
      render();
    }

    async function ratePhase2cScore(score) {
      alert(`谢谢你的反馈：${score} 分`);
      await resetFlow();
      stage = "input";
      render();
    }

    function openPhase2cMerchantDetail(id) {
      const m = findMerchant(id);
      if (!m && phase2cMerchantCache === null) {
        loadPhase2cMerchants().then(() => openPhase2cMerchantDetail(id));
        return;
      }
      if (!m) {
        phase2cDrawer = simpleDrawer("商详暂未加载", `<p>这个候选来自本地 Mock 状态，当前缺少完整商详字段。你仍然可以继续选择或换一换。</p>`);
        renderKeepingScroll();
        return;
      }
      const coupons = m.coupons || [{title: "双人套餐券", price: Math.max(20, Math.round((m.price || 80) * 1.6))}, {title: "满100减20", price: 20}];
      phase2cDrawer = `<div class="mini-drawer"><div class="drawer-bar"></div><div class="store-img" style="width:100%;height:130px;font-size:54px">${esc(m.image || emojiForCategory(m.category))}</div><h2>${esc(m.name)}</h2><p>★ ${esc(m.rating || "4.7")} · ${esc(m.area || "-")} · 营业 ${esc(m.open || "10:00")}-${esc(m.close || "22:00")} · 人均 ${money(m.price)}</p><div class="quote">${esc(m.review_snippet || "精选好评，适合当前行程。")}</div><h3>店铺券</h3>${coupons.map(c => `<div class="segment"><b>${esc(c.title || c.name)}</b><p>¥${esc(c.price || c.value || 0)} · Mock券</p></div>`).join("")}<h3>特色</h3><p>${esc((m.recommended_dishes || m.features || m.review_tags || []).join("、") || m.category)}</p><button onclick="closePhase2cDrawer()">关闭</button></div>`;
      renderKeepingScroll();
    }
    function findMerchant(id) {
      const wanted = String(id || "");
      if (!wanted) return null;
      const choiceSteps = Object.values(phase2cChoices || {}).flatMap(choice => [
        choice.A, choice.B, choice.chosen ? choice[choice.chosen] : null
      ]).filter(Boolean);
      const bookingSteps = ((session.booking_review || {}).segments || []).map(seg => normalizeBusinessStep({
        id: seg.merchant_id || seg.id,
        merchant_id: seg.merchant_id || seg.id,
        name: seg.merchant_name,
        category: seg.category,
        area: seg.area,
        price: seg.price || seg.cost,
        cost: seg.price || seg.cost,
        open: seg.open,
        close: seg.close,
        image: seg.image,
        rating: seg.rating,
        review_snippet: seg.review_snippet
      }));
      const all = [
        ...(phase2cMerchantCache || []),
        ...businessSteps(mainPlan()),
        ...choiceSteps,
        ...bookingSteps
      ];
      return all.find(m => String(m.id || m.merchant_id || "") === wanted || String(m.name || "") === wanted) || null;
    }
    function emojiForCategory(cat = "") {
      if (cat.includes("火锅")) return "🍲";
      if (cat.includes("剧本")) return "🎭";
      if (cat.includes("电影")) return "🎬";
      if (cat.includes("奶茶")) return "🧋";
      if (cat.includes("咖啡")) return "☕";
      if (cat.includes("台球")) return "🎱";
      if (cat.includes("按摩")) return "💆";
      if (cat.includes("酒店")) return "🏨";
      if (cat.includes("外卖")) return "🥡";
      return "🏬";
    }
    function distanceText(area) {
      const origin = (session.request || {}).origin_area || (session.request || {}).home_area;
      if (!origin || !area) return "待估";
      if (origin === area) return "同区域";
      return `${origin} → ${area}`;
    }

    // Final micro patch overrides: confirmed-only billing, typed drawers, and robust merchant detail.
    function openPhase2cDrawer(type, id = "") {
      if (type === "change") phase2cDrawer = changeDrawerHTML();
      else if (type === "bill") phase2cDrawer = billDrawerHTML();
      else if (type === "addon") phase2cDrawer = simpleDrawer("顺手来一个", `<p>这里展示当前路线附近的本地 Mock 小加购，不自动进入账单。</p><div class="qty-row"><span>蜜桃乌龙 ¥18</span><input id="addonQty" type="number" min="1" value="1"><button class="primary" onclick="confirmProductPurchase('addon_milk_tea','蜜桃乌龙',18,'addonQty')">加入</button></div>`);
      else if (type === "pay") phase2cDrawer = payDrawerHTML(id);
      else if (type === "coupon") phase2cDrawer = couponDrawerHTML(id);
      else if (type === "review") phase2cDrawer = simpleDrawer("评价", `<textarea placeholder="写一句评价 Mock"></textarea><button class="primary" onclick="alert('评价已提交 Mock');closePhase2cDrawer()">提交评价</button>`);
      else if (type === "support") phase2cDrawer = simpleDrawer("联系客服", `<p>已进入客服 Mock 页面，不连接真实客服。</p><button onclick="alert('客服工单已生成 Mock')">生成工单</button>`);
      else if (type === "product") phase2cDrawer = productDrawerHTML(id);
      render();
    }

    function payDrawerHTML(id) {
      const m = findMerchant(id) || {};
      const defaultAmount = Math.max(20, Number(m.price || m.cost || 128));
      return simpleDrawer("买单", `
        <p>请选择本地 Mock 支付方式，不会触发真实支付。</p>
        <div class="booking-row"><span>金额</span><input id="mockPayAmount" value="${Math.round(defaultAmount)}"></div>
        <div class="segment-actions">
          <button class="primary" onclick="confirmMeituanPay(${jsArg(id)})">美团买单</button>
          <button onclick="openPhase2cDrawer('coupon', ${jsArg(id)})">团购券</button>
        </div>
      `);
    }

    function confirmMeituanPay(id) {
      const amount = Number(document.getElementById("mockPayAmount")?.value || 0);
      const m = findMerchant(id) || {};
      upsertBillItem(`pay_${id || Date.now()}`, `${m.name || "美团买单"}`, amount, "pay");
      phase2cPayments[id || "manual"] = {amount, status: "confirmed"};
      closePhase2cDrawer();
    }

    function couponDrawerHTML(id) {
      const rawId = String(id || "");
      const merchantId = rawId.startsWith("coupon_") ? rawId.replace(/^coupon_/, "").replace(/_\d+$/, "") : rawId;
      const m = findMerchant(merchantId) || {};
      const coupons = m.coupons || [{title: "到店团购券", price: 88}, {title: "满100减20", price: 20}];
      return simpleDrawer("购买/核验券", coupons.map((c, idx) => {
        const key = `coupon_${merchantId || "unknown"}_${idx}`;
        const state = phase2cCoupons[key] || {};
        const title = c.title || c.name || "到店团购券";
        const price = Number(c.price || c.value || 0);
        return `<div class="segment"><b>${esc(title)}</b><p>¥${esc(price)} · ${state.purchased ? "二维码 Mock 已生成" : "未购买"}</p><div class="segment-actions">${state.purchased ? `<button class="primary" onclick="verifyCoupon(${jsArg(key)}, ${jsArg(title)}, ${price})">${state.verified ? "已验券" : "确认验券"}</button>` : `<button class="primary" onclick="buyCoupon(${jsArg(key)}, ${jsArg(title)}, ${price})">购买券</button>`}</div></div>`;
      }).join(""));
    }

    function buyCoupon(key, title, price) {
      phase2cCoupons[key] = {title, price, purchased: true, verified: false};
      alert("已购买，二维码 Mock 已生成");
      openPhase2cDrawer("coupon", key);
    }

    function verifyCoupon(key, title, price) {
      phase2cCoupons[key] = {...(phase2cCoupons[key] || {}), title, price, purchased: true, verified: true};
      upsertBillItem(key, title, Number(price || 0), "coupon");
      openPhase2cDrawer("coupon", key);
    }

    function productDrawerHTML(name) {
      const label = String(name || "本地生活商品");
      const price = /玫瑰|蔷薇|茉莉/.test(label) ? 188 : (/薯片|可乐|零食/.test(label) ? 12 : 18);
      return simpleDrawer("商品选择", `
        <p>${esc(label)}，本地 Mock 商品选择。</p>
        <div class="qty-row"><span>单价 ¥${price}</span><input id="productQty" type="number" min="1" value="1"><button class="primary" onclick="confirmProductPurchase(${jsArg(`product_${label}`)}, ${jsArg(label)}, ${price}, 'productQty')">确定</button></div>
      `);
    }

    function confirmProductPurchase(id, label, price, qtyInputId) {
      const qty = Math.max(1, Number(document.getElementById(qtyInputId)?.value || 1));
      upsertBillItem(id, `${label} ×${qty}`, Number(price || 0) * qty, "product");
      closePhase2cDrawer();
    }

    function billItemsFromBlocks() {
      return phase2cBill.items || [];
    }

    function billDrawerHTML() {
      const party = Math.max(1, actualPartySize());
      phase2cBill.items.forEach(it => { if (phase2cBill.included[it.id] === undefined) phase2cBill.included[it.id] = true; });
      const total = phase2cBill.items.filter(it => phase2cBill.included[it.id]).reduce((s, it) => s + Number(it.amount || 0), 0);
      const empty = phase2cBill.items.length ? "" : `<p class="muted">还没有确认买单、验券、打车或商品加购，所以账单暂时为空。</p>`;
      return `<div class="mini-drawer"><div class="drawer-bar"></div><h2>账单</h2>
        ${empty}
        ${phase2cBill.items.map(it => `<label class="booking-row"><span><input type="checkbox" ${phase2cBill.included[it.id] ? "checked" : ""} onchange="phase2cBill.included['${esc(it.id)}']=this.checked;openPhase2cDrawer('bill')"> ${esc(it.label)}</span><b>¥${Math.round(it.amount || 0)}</b></label>`).join("")}
        <div class="booking-row"><span>总金额</span><input value="${Math.round(total)}" oninput="phase2cBill.total=Number(this.value||0)"></div>
        <div class="booking-row"><span>单人金额</span><input value="${Math.round(total / party)}" oninput="phase2cBill.perPerson=Number(this.value||0)"></div>
        ${party > 1 ? `<button class="primary" onclick="alert('AA 分账链接已生成 Mock')">分账</button>` : ""}
        <p class="split-note">收款链接：/mock/a-money?amount=${Math.round(total)}（美团/微信支付 Mock）</p>
        <button onclick="closePhase2cDrawer()">关闭</button>
      </div>`;
    }

    function addBillItem(label, amount) {
      upsertBillItem("manual_" + Date.now(), label, amount, "manual");
    }

    function upsertBillItem(id, label, amount, kind = "manual") {
      const cleanId = String(id || ("manual_" + Date.now()));
      const value = Math.max(0, Number(amount || 0));
      const next = {id: cleanId, label, amount: value, kind};
      const index = phase2cBill.items.findIndex(it => it.id === cleanId);
      if (index >= 0) phase2cBill.items[index] = next;
      else phase2cBill.items.push(next);
      phase2cBill.included[cleanId] = true;
    }

    function findMerchant(id) {
      const wanted = String(id || "");
      if (!wanted) return null;
      const choiceSteps = Object.values(phase2cChoices || {}).flatMap(choice => [
        choice.A, choice.B, choice.chosen ? choice[choice.chosen] : null
      ]).filter(Boolean);
      const bookingSteps = ((session.booking_review || {}).segments || []).map(seg => normalizeBusinessStep({
        id: seg.merchant_id || seg.id,
        merchant_id: seg.merchant_id || seg.id,
        name: seg.merchant_name,
        category: seg.category,
        area: seg.area,
        price: seg.price || seg.cost,
        cost: seg.price || seg.cost,
        open: seg.open,
        close: seg.close,
        image: seg.image,
        rating: seg.rating,
        review_snippet: seg.review_snippet
      }));
      const allPlans = plans().flatMap(p => businessSteps(p));
      const all = [
        ...(phase2cMerchantCache || []),
        ...allPlans,
        ...businessSteps(mainPlan()),
        ...deliveryStepsFromPlan(),
        ...choiceSteps,
        ...bookingSteps
      ];
      return all.find(m => String(m.id || m.merchant_id || "") === wanted || String(m.name || "") === wanted) || null;
    }

    function mockMerchantFromId(id) {
      const text = String(id || "本地生活商户");
      const isFlower = text.includes("flower");
      return normalizeBusinessStep({
        id: text,
        merchant_id: text,
        name: isFlower ? "美团鲜花速达" : (text || "本地生活商户"),
        category: isFlower ? "花店" : "本地生活",
        area: (session.request || {}).home_area || "当前区域",
        price: isFlower ? 188 : 88,
        cost: isFlower ? 188 : 88,
        rating: "4.8",
        review_count: 268,
        review_snippet: isFlower ? "配送稳定，适合生日和纪念日。" : "本地 Mock 商详，适合当前行程。",
        open: "10:00",
        close: "22:00",
        image: isFlower ? "💐" : "🏬",
        recommended_dishes: isFlower ? ["生日玫瑰88朵", "恩爱蔷薇99朵", "纪念茉莉66朵"] : ["精选套餐", "团购券", "到店服务"],
        coupons: [{title: "新人立减券", price: 20}, {title: "到店套餐券", price: isFlower ? 166 : 88}]
      });
    }

    function openPhase2cMerchantDetail(id) {
      let m = findMerchant(id);
      if (!m && phase2cMerchantCache === null) {
        loadPhase2cMerchants().then(() => openPhase2cMerchantDetail(id));
        return;
      }
      if (!m) m = mockMerchantFromId(id);
      const coupons = m.coupons || [{title: "双人套餐券", price: Math.max(20, Math.round((m.price || 80) * 1.6))}, {title: "满100减20", price: 20}];
      phase2cDrawer = `<div class="mini-drawer"><div class="drawer-bar"></div><div class="store-img" style="width:100%;height:130px;font-size:54px">${esc(m.image || emojiForCategory(m.category))}</div><h2>${esc(m.name)}</h2><p>★ ${esc(m.rating || "4.7")} · ${esc(m.area || "-")} · 营业 ${esc(m.open || "10:00")}-${esc(m.close || "22:00")} · 人均 ${money(m.price)}</p><div class="quote">${esc(m.review_snippet || "精选好评，适合当前行程。")}</div><h3>店铺券</h3>${coupons.map(c => `<div class="segment"><b>${esc(c.title || c.name)}</b><p>¥${esc(c.price || c.value || 0)} · Mock券</p></div>`).join("")}<h3>特色</h3><p>${esc((m.recommended_dishes || m.features || m.review_tags || []).join("、") || m.category)}</p><button onclick="closePhase2cDrawer()">关闭</button></div>`;
      renderKeepingScroll();
    }

    const oldResetFlow = resetFlow;
    async function resetFlow() {
      phase2cChoices = {};
      phase2cVotes = {};
      phase2cBookings = {};
      phase2cMessages = [];
      phase2cExecutionIndex = 0;
      phase2cDrawer = "";
      phase2cBill = {items: [], included: {}, total: 0, perPerson: 0};
      phase2cTaxi = {};
      phase2cPayments = {};
      phase2cCoupons = {};
      phase2cProductState = {};
      await oldResetFlow();
    }
    render();
  </script>
</body>
</html>
